name: Fork Compile Check

# Lightweight CI for the yuyu-clauds fork's transport-surgery work on
# feature/** branches. Upstream's ci.yml only runs on main / PRs to main,
# which would skip our long-lived feature branches entirely. We just need
# a fast "does this compile?" signal — no lint, no E2E, no release build.

on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile (debug main + unit-test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # app/build.gradle.kts loads two JARs from local Maven `target/`:
      #   implementation(...ngrok-java-1.1.1.jar)         — main API
      #   implementation(...ngrok-java-native-classes.jar) — NativeSession etc
      # Both are required by compileDebugKotlin (AGP IdentityTransform fails
      # fast if any implementation-config file is missing). host.jar is
      # testRuntimeOnly, so we skip it (no Rust toolchain needed).
      - name: Cache ngrok-java JARs
        id: cache-ngrok-jars
        uses: actions/cache@v5
        with:
          path: |
            vendor/ngrok-java/ngrok-java/target/ngrok-java-1.1.1.jar
            vendor/ngrok-java/ngrok-java-native/target/ngrok-java-native-classes.jar
          key: ngrok-jars-v2-${{ runner.os }}-${{ hashFiles('vendor/ngrok-java/ngrok-java/pom.xml', 'vendor/ngrok-java/ngrok-java/src/**', 'vendor/ngrok-java/ngrok-java-native/pom.xml', 'vendor/ngrok-java/ngrok-java-native/src/main/java/**') }}

      - name: Build ngrok-java JARs (only on cache miss)
        if: steps.cache-ngrok-jars.outputs.cache-hit != 'true'
        run: |
          cd vendor/ngrok-java
          mvn compile -pl ngrok-java-native --also-make --global-toolchains toolchains.xml -q
          mvn package -pl ngrok-java -DskipTests --global-toolchains toolchains.xml -q
          (cd ngrok-java-native/target/classes && jar cf ../ngrok-java-native-classes.jar com/)
        env:
          JAVA_11_HOME: ${{ env.JAVA_HOME }}
          JAVA_17_HOME: ${{ env.JAVA_HOME }}

      - name: Compile debug main + unit-test sources
        run: ./gradlew compileDebugKotlin compileDebugUnitTestKotlin --stacktrace
