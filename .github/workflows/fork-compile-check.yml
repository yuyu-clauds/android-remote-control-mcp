name: Fork Compile Check

# Lightweight CI for the yuyu-clauds fork's transport-surgery work on
# feature/** branches. Upstream's ci.yml only runs on main / PRs to main,
# which would skip our long-lived feature branches entirely.
#
# After the ngrok + cloudflared cleanup, the fork has zero native deps,
# so compileDebugKotlin needs nothing more than JDK + Gradle.

on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile (debug main + unit-test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile debug main + unit-test sources
        run: ./gradlew compileDebugKotlin compileDebugUnitTestKotlin --stacktrace
