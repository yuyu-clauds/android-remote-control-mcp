name: Fork Compile Check

# Lightweight CI for the yuyu-clauds fork's transport-surgery work on
# feature/** branches. Upstream's ci.yml only runs on main / PRs to main,
# which would skip our long-lived feature branches entirely. We just need
# a fast "does this compile?" signal — no lint, no E2E, no release build.

on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile (debug main + unit-test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ngrok-java is a transitive Gradle classpath dependency loaded from
      # the local Maven `target/` directory. Without the JAR, compileDebugKotlin
      # fails to resolve symbols from upstream's tunnel module. Cache it
      # between runs so only the first cold build pays the ~5min Maven cost.
      - name: Cache ngrok-java JAR
        id: cache-ngrok-jar
        uses: actions/cache@v5
        with:
          path: vendor/ngrok-java/ngrok-java/target/ngrok-java-1.1.1.jar
          key: ngrok-jar-${{ runner.os }}-${{ hashFiles('vendor/ngrok-java/ngrok-java/pom.xml', 'vendor/ngrok-java/ngrok-java/src/**') }}

      - name: Build ngrok-java JAR (only on cache miss)
        if: steps.cache-ngrok-jar.outputs.cache-hit != 'true'
        run: |
          cd vendor/ngrok-java
          mvn package -pl ngrok-java -DskipTests --global-toolchains toolchains.xml -q
        env:
          JAVA_11_HOME: ${{ env.JAVA_HOME }}
          JAVA_17_HOME: ${{ env.JAVA_HOME }}

      - name: Compile debug main + unit-test sources
        run: ./gradlew compileDebugKotlin compileDebugUnitTestKotlin --stacktrace
